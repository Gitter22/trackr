<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Workspace not found · Trcker</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        color: #000;
        background: #faf7ff;
      }
      main {
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-size: 64px;
        margin: 0;
        color: #7600fd;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 10px 18px;
        border-radius: 8px;
        background: #7600fd;
        color: #fff;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>This workspace doesn't exist or is not active.</p>
      <a id="home" href="/">Go to Trcker home</a>
    </main>
    <script>
      // Link to the root domain (strip the tenant subdomain).
      var parts = location.host.split('.');
      document.getElementById('home').href = location.protocol + '//' + parts.slice(1).join('.') + '/';
    </script>
  </body>
</html>
